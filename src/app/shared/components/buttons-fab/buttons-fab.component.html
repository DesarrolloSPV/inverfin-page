<ion-fab vertical="bottom" horizontal="end" slot="fixed">
  <!-- Botón principal -->
  <ion-fab-button>
    <ion-icon name="arrow-up-outline"></ion-icon>
  </ion-fab-button>

  <!-- Lista de acciones -->
  <ion-fab-list side="top">
    <ion-fab-button href="https://www.facebook.com" target="_blank">
      <ion-icon name="logo-facebook"></ion-icon>
    </ion-fab-button>
    <ion-fab-button href="https://www.instagram.com" target="_blank">
      <ion-icon name="logo-instagram"></ion-icon>
    </ion-fab-button>
    <ion-fab-button href="https://x.com" target="_blank">
      <ion-icon name="logo-twitter"></ion-icon> <!-- X usa logo-twitter -->
    </ion-fab-button>
    <ion-fab-button href="https://www.linkedin.com" target="_blank">
      <ion-icon name="logo-linkedin"></ion-icon>
    </ion-fab-button>
    <ion-fab-button href="https://wa.me/5215500000000" target="_blank">
      <ion-icon name="logo-whatsapp"></ion-icon>
    </ion-fab-button>
    <ion-fab-button routerLink="/contacto">
      <ion-icon name="mail-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab-list>
</ion-fab>
