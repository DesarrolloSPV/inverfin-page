<ion-header>
  <ion-toolbar color="light">
    <!-- Logo -->
    <ion-buttons slot="start">
      <img src="../../../../assets/img/Logo.svg" alt="Inverfin Logo" class="logo" />
    </ion-buttons>

    <!-- Menú visible solo en escritorio -->
    <ion-buttons class="desktop-menu" slot="end">
      <ion-button routerLink="/home">Inicio</ion-button>
      <ion-button routerLink="/inverfin">Inverfin</ion-button>

      <!-- Botón Servicios con popover -->
      <ion-button id="services-btn">Servicios</ion-button>
      <ion-popover trigger="services-btn" side="bottom" alignment="center">
        <ion-content>
          <ion-list>
            <ion-item button routerLink="/productos/arrendamiento">
              Arrendamiento puro
            </ion-item>
            <ion-item button routerLink="/productos/factoraje">
              Factoraje
            </ion-item>
          </ion-list>
        </ion-content>
      </ion-popover>

      <ion-button routerLink="/blog">Blog</ion-button>
      <ion-button (click)="openContact($event)">¿Hablamos?</ion-button>
    </ion-buttons>

    <!-- Botón hamburguesa visible solo en móvil -->
    <ion-buttons class="mobile-menu" slot="end">
      <ion-menu-button menu="menuId"></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
