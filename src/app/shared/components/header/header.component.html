<ion-header>
  <ion-toolbar color="secundary">
    <!-- Logo  -->
    <ion-buttons slot="start">
      <img src="../../../../assets/img/Logo.png" alt="Inverfin Logo" class="logo" />
    </ion-buttons>

    <!-- Menú visible solo en escritorio -->
    <ion-buttons class="desktop-menu" slot="end">
      <ion-button routerLink="/home">Inicio</ion-button>
      <ion-button routerLink="/clientes">Clientes</ion-button>
      <ion-button routerLink="/reportes">Reportes</ion-button>
      <ion-button color="b" routerLink="/Contacto">¿Hablamos?</ion-button>
    </ion-buttons>

    <!-- Botón hamburguesa visible solo en móvil -->
    <ion-buttons class="mobile-menu" slot="end">
      <ion-menu-button menu="menuId"></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
