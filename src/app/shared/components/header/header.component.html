<ion-header>
  <ion-toolbar color="light">
    <!-- Logo -->
    <ion-buttons slot="start">
      <img src="../../../../assets/img/Logo.svg" alt="Inverfin Logo" class="logo" />
    </ion-buttons>

    <!-- Menú visible solo en escritorio -->
    <ion-buttons class="desktop-menu" slot="end">
      <ion-button >Inicio</ion-button>
      <ion-button >Clientes</ion-button>
      <ion-button >Reportes</ion-button>
      <ion-button >¿Hablamos?</ion-button>
    </ion-buttons>

    <!-- Botón hamburguesa visible solo en móvil -->
    <ion-buttons class="mobile-menu" slot="end">
      <ion-menu-button menu="menuId"></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
