<section class="cta-section">
  <div class="cta-container">
    <h2>{{ 'history.cta' | translate }}</h2>
  <p [innerHTML]="'history.cta2' | translate"></p>

    <div class="cta-buttons">
      <ion-button (click)="openContactModal()">{{'common.contact-us'|translate}}</ion-button>
    </div>

    <div class="cta-secondary">
      <ion-button color="light" class="secondary-btn" routerLink="/productos/arrendamiento" routerDirection="forward">{{'common.pure-leasing'|translate}}</ion-button>
      <ion-button color="light" class="secondary-btn" routerLink="/productos/factoraje" routerDirection="forward">{{'common.factoring'|translate}}</ion-button>
    </div>
  </div>
</section>
