<section class="about-history">
  <div class="container">
    <div class="about-intro">
      <h2>{{ 'history.about1' | translate }}</h2>
      <p class="p-content" [innerHTML]="'history.about2' | translate"></p>
    </div>

    <div class="about-grid">
      <!-- Misión -->
      <div class="about-card">
        <div class="card-icon-header">
          <ion-icon name="rocket-outline"></ion-icon>
        </div>
        <div class="card-content">
          <h3>{{ 'history.about-card1' | translate }}</h3>
          <p>{{ 'history.about-card2' | translate }}</p>
        </div>
      </div>

      <!-- Visión -->
      <div class="about-card">
        <div class="card-icon-header">
          <ion-icon name="eye-outline"></ion-icon>
        </div>
        <div class="card-content">
          <h3>{{ 'history.about-card3' | translate }}</h3>
          <p>{{ 'history.about-card4' | translate }}</p>
        </div>
      </div>

      <!-- Propósito -->
      <div class="about-card">
        <div class="card-icon-header">
          <ion-icon name="heart-outline"></ion-icon>
        </div>
        <div class="card-content">
          <h3>{{ 'history.about-card5' | translate }}</h3>
          <p>{{ 'history.about-card6' | translate }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
