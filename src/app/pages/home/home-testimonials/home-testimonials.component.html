<section class="testimonials-section">
  <div class="testimonials-header">
    <h5>{{ 'home.testimonials1' | translate }}</h5>
    <h2>{{ 'home.testimonials2' | translate }}</h2>
    <p [innerHTML]="'home.testimonials3' | translate"></p>
  </div>

  <swiper-container
    #swiperTestimonials
    loop="true"
    slides-per-view="3"
    space-between="30"
    centered-slides="false"
    auto-height="false"
    [autoplay]="{ delay: 5000, disableOnInteraction: false }"
    speed="800"
    pagination="true"
    navigation="true"
    class="testimonials-swiper"
    [breakpoints]="{
      '0': { slidesPerView: 1, spaceBetween: 20 },
      '768': { slidesPerView: 3, spaceBetween: 30 }
    }"
  >
    <swiper-slide *ngFor="let item of testimonialsList" class="testimonial-card">
      <div class="testimonial-content">
        <div class="quote-mark">“</div>
        <p [innerHTML]="item.comment[translate.currentLang || 'es']"></p>
        <div class="card-footer-accent">
          <span>Caso de Éxito</span>
        </div>
      </div>
    </swiper-slide>
  </swiper-container>
</section>
